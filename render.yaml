# Render Blueprint (Infrastructure as Code).
# Render panelida: New → Blueprint → shu repo. Postgres va web service
# birga yaratiladi, DATABASE_URL avtomatik ulanadi.

databases:
  - name: update-dashboard-db
    # Boshqariladigan Postgres: deploy/restartga bog'liq emas.
    # HOZIR BEPUL: Render bepul Postgres'ni yaratilganidan 30 kun o'tib O'CHIRADI
    # (foydalanuvchilar, tokenlar, board ma'lumoti bilan). Undan oldin pullik
    # tarifga o'tkazing: plan: 0.1c-256mb (zaxira nusxa ham shunda paydo bo'ladi).
    plan: free
    databaseName: update_dashboard
    user: update_dashboard
    ipAllowList: [] # bo'sh — tashqi internetdan yopiq, faqat Render ichki tarmog'idan

services:
  - type: web
    name: update-dashboard
    runtime: node
    # HOZIR BEPUL: 15 daqiqa so'rov bo'lmasa xizmat uxlaydi — shu vaqtda fon
    # yangilanishi (platformadan ma'lumot olish, DOT izlari) to'xtaydi, birinchi
    # kirishda ~1 daqiqa uyg'onadi. Doimiy ishlashi uchun: plan: 0.5c-512mb.
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: update-dashboard-db
          property: connectionString # ichki ulanish satri (bir region ichida)
      # Blueprint yaratilganda bir marta tasodifiy qiymat beriladi va o'zgarmaydi.
      # Uni almashtirsangiz saqlangan ELD tokenlari o'qilmay qoladi (qayta ulash kerak).
      - key: SECRET_KEY
        generateValue: true
      - key: DEFAULT_ADMIN_LOGIN
        value: admin
      # Maxfiy qiymatlar repoga tushmaydi: Render birinchi deploy'da so'raydi.
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: REFRESH_INTERVAL_SEC
        value: 60
